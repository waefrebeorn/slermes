# ── GitHub Release: Build, package, and publish Slermes for all platforms ──
# Triggered by pushing a v* tag (e.g., v0.16.0, v1.0.0)
# Builds Linux x86_64 + ARM, macOS, Windows, Docker → attaches to GitHub Release

name: Release

on:
  push:
    tags:
      - 'v*'         # v0.16.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.16.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Linux x86_64 native ───
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev \
            libncursesw6-dev libpanelw-dev libwayland-dev pkg-config file
      - name: ncurses links
        run: |
          mkdir -p lib/syslib
          ln -sf /usr/lib/x86_64-linux-gnu/libncursesw.so.6 lib/syslib/libncursesw.so
          ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 lib/syslib/libtinfo.so
          ln -sf /usr/lib/x86_64-linux-gnu/libpanelw.so.6 lib/syslib/libpanelw.so
      - name: Build
        run: make deps && make -j$(nproc) 2>&1 | tail -10
      - name: Verify
        run: |
          file slermes
          du -h slermes
      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh 2>&1 || echo "AppImage build skipped"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            slermes
            Slermes-*.AppImage
          if-no-files-found: warn

  # ─── macOS arm64 ───
  macos-arm64:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          brew update >/dev/null 2>&1
          brew install pkg-config openssl file || true
      - name: Build
        run: make deps && make -j$(sysctl -n hw.logicalcpu) 2>&1 | tail -10
      - name: Verify
        run: |
          file slermes
          du -h slermes
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: slermes
          if-no-files-found: error

  # ─── Linux ARM64 cross ───
  linux-aarch64:
    name: Linux ARM64 (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libssl-dev file
      - name: Cross-compile
        run: |
          make deps CC=aarch64-linux-gnu-gcc
          make -j$(nproc) CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar \
            CFLAGS_EXTRA="-Wno-pointer-sign" 2>&1 | tail -10
          mv slermes slermes-linux-aarch64
          file slermes-linux-aarch64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-aarch64
          path: slermes-linux-aarch64
          if-no-files-found: error

  # ─── Linux ARMv7 cross ───
  linux-armv7:
    name: Linux ARMv7 (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf libssl-dev file
      - name: Cross-compile
        run: |
          make deps CC=arm-linux-gnueabihf-gcc
          make -j$(nproc) CC=arm-linux-gnueabihf-gcc AR=arm-linux-gnueabihf-ar \
            CFLAGS_EXTRA="-Wno-pointer-sign -march=armv7-a" 2>&1 | tail -10
          mv slermes slermes-linux-armv7
          file slermes-linux-armv7
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-armv7
          path: slermes-linux-armv7
          if-no-files-found: error

  # ─── Windows x86_64 cross ───
  windows-x86_64:
    name: Windows x86_64 (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 libssl-dev file
      - name: Cross-compile
        run: |
          make deps CC=x86_64-w64-mingw32-gcc
          make -j$(nproc) CC=x86_64-w64-mingw32-gcc AR=x86_64-w64-mingw32-ar \
            CFLAGS_EXTRA="-D_WIN32_WINNT=0x0A00 -Wno-pointer-sign" \
            LDFLAGS_EXTRA="-lws2_32" 2>&1 | tail -10
          mv slermes slermes-windows-x86_64.exe
          file slermes-windows-x86_64.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: slermes-windows-x86_64.exe
          if-no-files-found: error

  # ─── Docker image ───
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Create GitHub Release ───
  create-release:
    name: Create Release
    needs:
      - linux-x86_64
      - macos-arm64
      - linux-aarch64
      - linux-armv7
      - windows-x86_64
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Generate changelog from git log
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline --no-decorate "$PREV_TAG..$TAG" 2>/dev/null || echo "No changes since $PREV_TAG")
          else
            LOG=$(git log --oneline --no-decorate -30 2>/dev/null || echo "Initial release")
          fi
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          gh release create "$TAG" \
            --title "Slermes $TAG" \
            --notes "$(cat <<-EONOTES
          ## 📦 Slermes $TAG

          Build artifacts for all platforms:

          | Platform | Arch | File |
          |----------|------|------|
          | Linux | x86_64 | slermes |
          | Linux | x86_64 | Slermes-*.AppImage |
          | Linux | aarch64 | slermes-linux-aarch64 |
          | Linux | armv7 | slermes-linux-armv7 |
          | macOS | arm64 | slermes |
          | Windows | x86_64 | slermes-windows-x86_64.exe |
          | Docker | all | ghcr.io/waefrebeorn/slermes:\$TAG |

          ### Changes
          ${{ steps.notes.outputs.log }}

          ---
          *Built from scratch in C11. No Python. No Electron. No npm.* 🌻
          EONOTES
          )" \
            artifacts/release-*/* 2>&1

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          echo "Uploading assets to release $TAG..."
          for dir in artifacts/release-*; do
            for file in "$dir"/*; do
              if [ -f "$file" ]; then
                echo "Uploading: $file"
                gh release upload "$TAG" "$file" --clobber 2>&1
              fi
            done
          done
