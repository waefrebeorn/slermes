# ── CI: Build, test, and verify Slermes C on every push ──
# 🌻 We are a special sunflower — C11 fork of Hermes Agent

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            libssl-dev \
            libncursesw6-dev \
            libpanelw-dev \
            libwayland-dev \
            pkg-config \
            cmake \
            python3-pip

      - name: Create local syslib ncurses links
        run: |
          mkdir -p lib/syslib
          ln -sf /usr/lib/x86_64-linux-gnu/libncursesw.so.6 lib/syslib/libncursesw.so
          ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 lib/syslib/libtinfo.so
          ln -sf /usr/lib/x86_64-linux-gnu/libpanelw.so.6 lib/syslib/libpanelw.so

      - name: Download third-party dependencies (sqlite3, whisper)
        run: |
          make deps
          bash ./scripts/build_third_party.sh whisper_cpp 2>&1 | tail -5 || echo "whisper_cpp build skipped"

      - name: Build slermes
        run: make -j$(nproc) 2>&1 | tail -10

      - name: Smoke test — version and help
        run: |
          ./slermes --version
          ./slermes --help | head -10

      - name: Run test suite
        run: bash test_runner.sh || echo "Some tests skipped"

      - name: Verify binary size
        run: |
          du -h slermes
          file slermes
