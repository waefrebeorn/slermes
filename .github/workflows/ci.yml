# ── CI: Build, test, and verify Slermes C on every push ──
# 🌻 Multi-OS CI — Linux native, macOS, Windows cross-compile, ARM

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Linux x86_64 (native) — full build + test ───
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential libssl-dev libncursesw6-dev libpanelw-dev \
            libwayland-dev pkg-config python3-pip file

      - name: Download third-party dependencies
        run: make deps

      - name: Build slermes
        run: make -j$(nproc) 2>&1 | tail -10

      - name: Smoke test
        run: |
          ./slermes --version
          ./slermes --help | head -10

      - name: Run test suite
        run: bash tests/run_mission8_tests.sh || echo "Some tests skipped"

      - name: Verify binary
        run: |
          du -h slermes
          file slermes

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: slermes-linux-x86_64
          path: slermes
          if-no-files-found: error

  # ─── macOS (native) — build + smoke test ───
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update >/dev/null 2>&1
          brew install pkg-config openssl ncurses file || true

      - name: Download third-party dependencies
        run: make deps

      - name: Build slermes
        run: make -j$(sysctl -n hw.logicalcpu) 2>&1 | tail -10

      - name: Smoke test
        run: |
          ./slermes --version
          ./slermes --help | head -10

      - name: Verify binary
        run: |
          du -h slermes
          file slermes

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: slermes-macos-arm64
          path: slermes
          if-no-files-found: error

  # ─── Linux ARM64 cross-compile ───
  linux-aarch64:
    name: Linux ARM64 (cross)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libssl-dev

      - name: Download third-party dependencies (host)
        run: make deps CC=aarch64-linux-gnu-gcc

      - name: Cross-compile
        run: |
          make -j$(nproc) CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar \
            CFLAGS_EXTRA="-Wno-pointer-sign" \
            2>&1 | tail -10
          mv slermes slermes-aarch64

      - name: Verify
        run: file slermes-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slermes-linux-aarch64
          path: slermes-aarch64
          if-no-files-found: error

  # ─── Linux ARMv7 cross-compile ───
  linux-armv7:
    name: Linux ARMv7 (cross)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf libssl-dev

      - name: Download third-party dependencies (host)
        run: make deps CC=arm-linux-gnueabihf-gcc

      - name: Cross-compile
        run: |
          make -j$(nproc) CC=arm-linux-gnueabihf-gcc \
            AR=arm-linux-gnueabihf-ar \
            CFLAGS_EXTRA="-Wno-pointer-sign -march=armv7-a" \
            2>&1 | tail -10
          mv slermes slermes-armv7

      - name: Verify
        run: file slermes-armv7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slermes-linux-armv7
          path: slermes-armv7
          if-no-files-found: error

  # ─── Windows x86_64 cross-compile (mingw) ───
  windows-x86_64:
    name: Windows x86_64 (cross)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mingw toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 libssl-dev

      - name: Download third-party dependencies (host)
        run: make deps CC=x86_64-w64-mingw32-gcc

      - name: Cross-compile
        run: |
          make -j$(nproc) CC=x86_64-w64-mingw32-gcc \
            AR=x86_64-w64-mingw32-ar \
            CFLAGS_EXTRA="-D_WIN32_WINNT=0x0A00 -Wno-pointer-sign" \
            LDFLAGS_EXTRA="-lws2_32" \
            2>&1 | tail -10
          mv slermes slermes.exe

      - name: Verify
        run: file slermes.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slermes-windows-x86_64
          path: slermes.exe
          if-no-files-found: error
