# ── CI: Build, test, and verify Slermes C on every push ──
# 🌻 Multi-OS CI — Linux native, macOS, Windows cross-compile, ARM
# Uses ci-build.sh to bypass Make 4.3 pattern-rule resolution bug on GHA.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Linux x86_64 (native) — full build + test ───
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential libssl-dev libncursesw6-dev libpanelw-dev \
            libwayland-dev pkg-config python3-pip file

      - name: Download third-party dependencies
        run: make deps

      - name: Build slermes
        run: bash ci-build.sh 2>&1

      - name: Smoke test
        run: |
          ./slermes --version
          ./slermes --help | head -10

      - name: Run test suite
        run: bash tests/run_mission8_tests.sh || echo "Some tests skipped"

      - name: Verify binary
        run: |
          du -h slermes
          file slermes

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: slermes-linux-x86_64
          path: slermes
          if-no-files-found: error

  # ─── macOS (native) — build + smoke test ───
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update >/dev/null 2>&1
          brew install pkg-config openssl ncurses file || true

      - name: Download third-party dependencies
        run: make deps

      - name: Build slermes
        run: make -j$(sysctl -n hw.logicalcpu) 2>&1

      - name: Smoke test
        run: |
          ./slermes --version
          ./slermes --help | head -10

      - name: Verify binary
        run: |
          du -h slermes
          file slermes

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: slermes-macos-arm64
          path: slermes
          if-no-files-found: error

  uv-lockfile:
    name: Check uv.lock
    needs: detect
    uses: ./.github/workflows/uv-lockfile-check.yml

  infographic-check:
    name: Check no committed infographics
    needs: detect
    uses: ./.github/workflows/infographic-check.yml

  lockfile-diff:
    name: package-lock.json diff
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && needs.detect.outputs.npm_lock == 'true'
    uses: ./.github/workflows/lockfile-diff.yml

  docker-lint:
    name: Lint Docker scripts
    needs: detect
    if: needs.detect.outputs.docker_meta == 'true'
    uses: ./.github/workflows/docker-lint.yml

  docker:
    name: Build&Test Docker image
    needs: detect
    # Trusted main pushes run docker.yml directly so its container-publish
    # environment secrets never cross this reusable-workflow call. PR runs
    # remain build/test-only and secret-free.
    if: needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.python == 'true' || needs.detect.outputs.frontend == 'true' || needs.detect.outputs.docker_meta == 'true')
    uses: ./.github/workflows/docker.yml

  supply-chain:
    name: Supply-chain scan
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.scan == 'true' || needs.detect.outputs.deps == 'true')
    uses: ./.github/workflows/supply-chain-audit.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}
      scan: ${{ needs.detect.outputs.scan == 'true' }}
      deps: ${{ needs.detect.outputs.deps == 'true' }}

  review-labels:
    name: Review label gate
    needs: [detect, supply-chain]
    if: always() && needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.ci_review == 'true' || needs.detect.outputs.mcp_catalog == 'true' || needs.supply-chain.outputs.critical_findings == 'true')
    uses: ./.github/workflows/review-labels.yml
    with:
      ci_review: ${{ needs.detect.outputs.ci_review == 'true' }}
      ci_review_files: ${{ needs.detect.outputs.ci_review_files }}
      mcp_catalog: ${{ needs.detect.outputs.mcp_catalog == 'true' }}
      supply_chain: ${{ needs.supply-chain.outputs.critical_findings == 'true' }}

  osv-scanner:
    name: OSV scan
    uses: ./.github/workflows/osv-scanner.yml

  # ─────────────────────────────────────────────────────────────────────
  # Live-updating PR review comment.
  #
  # A single ``comment-live`` job polls the GitHub Actions API every 15s
  # for job statuses in this run, re-assembles the review comment from
  # whatever results are available, and upserts it via the
  # ``<!-- hermes-ci-review-bot -->`` marker.
  #
  # When the visible job set goes quiet, the poller waits 10 seconds and polls
  # once more so downstream jobs created by an aggregate gate get included.
  # ─────────────────────────────────────────────────────────────────────
  comment-live:
    name: CI review comment (live)
    needs: [detect, review-labels, lockfile-diff, supply-chain, osv-scanner, uv-lockfile, history-check, contributor-check, e2e-desktop]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libssl-dev

      - name: Download third-party dependencies (host)
        run: make deps CC=aarch64-linux-gnu-gcc

      - name: Cross-compile
        run: |
          CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar bash ci-build.sh 2>&1
          mv slermes slermes-aarch64

      - name: Verify
        run: file slermes-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slermes-linux-aarch64
          path: slermes-aarch64
          if-no-files-found: error

  # ─── Linux ARMv7 cross-compile ───
  linux-armv7:
    name: Linux ARMv7 (cross)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf libssl-dev

      - name: Download third-party dependencies (host)
        run: make deps CC=arm-linux-gnueabihf-gcc

      - name: Cross-compile
        run: |
          CC=arm-linux-gnueabihf-gcc AR=arm-linux-gnueabihf-ar \
            MAKE_OPTS="CFLAGS_EXTRA=-Wno-pointer-sign" bash ci-build.sh 2>&1
          mv slermes slermes-armv7

      - name: Verify
        run: file slermes-armv7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slermes-linux-armv7
          path: slermes-armv7
          if-no-files-found: error

  # ─── Windows x86_64 cross-compile (mingw) ───
  windows-x86_64:
    name: Windows x86_64 (cross)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mingw toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 libssl-dev

      - name: Download third-party dependencies (host)
        run: make deps CC=x86_64-w64-mingw32-gcc

      - name: Cross-compile
        run: |
          CC=x86_64-w64-mingw32-gcc AR=x86_64-w64-mingw32-ar \
            MAKE_OPTS="CFLAGS_EXTRA='-D_WIN32_WINNT=0x0A00 -Wno-pointer-sign'" \
            bash ci-build.sh 2>&1
          mv slermes slermes.exe

      - name: Verify
        run: file slermes.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slermes-windows-x86_64
          path: slermes.exe
          if-no-files-found: error
