# ── CI: Build and test slermes on every push ──

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev libncurses-dev python3-pip
          pip3 install --user cppcheck

      - name: Build slermes
        run: make -j$(nproc)

      - name: Smoke test — help
        run: ./slermes --help | head -5

      - name: Static analysis — cppcheck
        run: make static-analysis
        continue-on-error: true

      - name: Run test suite
        run: bash test_runner.sh

      - name: Build asan variant
        run: make asan

      - name: ASan test suite (baseline — pre-existing failures documented)
        run: make asan-test
        continue-on-error: true

      - name: Coverage gate (monitoring — 1% threshold)
        run: make coverage-gate COVERAGE_THRESHOLD=1.0
        continue-on-error: true
